<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        display: flex;
        gap: 30px;
      }
      li {
        width: 200px;
        background-color: antiquewhite;
        padding: 20px;
      }
      li img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <ul id="prodouctList">
      <!-- js출력 -->
    </ul>
    <script>
      const proList = document.querySelector("#prodouctList");
      // console.log(proList);
      // 더미 데이터
      const products = [
        {
          name: "티셔츠",
          pric: 15000,
          desc: "이쁜 티셔츠",
          img: "images/tshirt.jpg",
        },
        {
          name: "청바지",
          pric: 25000,
          desc: "이쁜 청바지",
          img: "images/jeans.jpg",
        },
        {
          name: "운동화",
          pric: 45000,
          desc: "이쁜 운동화",
          img: "images/shoes.jpg",
        },
      ];
      //   console.log(products);
      // products.forEach(function(){})
      products.forEach((item, index) => {
        // console.log(item, index);
        // console.log(item.name);
        // console.log(item.pric);
        // console.log(item.desc);
        proList.innerHTML += `
         <li>
        <img src="${item.img}" alt="${item.desc}" />
        <h3>상품 이름 : ${item.name}</h3>
        <p>상품 설명 :  ${item.desc}</p>
        <p>상품 가격 :  ${item.pric.toLocaleString()} 원</p>
      </li>
        `;
      });
    </script>
  </body>
</html>
