<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연산자</title>
  </head>
  <body>
    <script>
      //   <!-- 계산하거나 비교할 때 쓰는 기호 -->
      //   <!-- 산술 연산자(계산) -->
      let a = 10;
      let b = 3;
      console.log(a + b); // 더하기
      console.log(a - b); // 빼기
      console.log(a * b); // 곱하기
      console.log(a / b); // 나누기
      console.log(a % b); // 나머지 값
      //   <!-- 비교 연산자(맞는지 확인) -->
      console.log(5 > 3); //true
      console.log(5 < 3); //false
      console.log(5 == 3); //false
      console.log(5 === "5"); //완전히 같은지 확인
      console.log(5 != 3); //부정
      //   <!-- 논리 연산자(조건이 여러개) -->
      let age = 20;
      console.log(age > 18 && age < 30); // && 둘다 같아야지 true
      console.log(age > 18 || age > 30); // || 하나만 맞아도 true
      // ! 반대로 바꾸기
      let isLogin = true
      console.log(!isLogin); // false
      //   <!-- 증가/감소 연산자 -->
      let count = 5
      count++ // ++ 증가
      console.log(count);
      count-- // -- 감소
      console.log(count);
      
    </script>
  </body>
</html>
